# ==========================================================================
# TabPFN-NIDS Pipeline Configuration
# ==========================================================================
# Central config for the UNSW-NB15 PCAP → TabPFN intrusion detection pipeline.
# Every module reads from this file via src/tabpfn_nids/pipeline_config.py.
# Do NOT hard-code these values in source code.

# --------------------------------------------------------------------------
# Paths (relative to project root)
# --------------------------------------------------------------------------
paths:
  raw_data_dir: "data/raw/UNSW-NB15"
  intermediate_dir: "data/intermediate"
  processed_dir: "data/processed"
  artifacts_dir: "data/artifacts"
  results_dir: "results"
  logs_dir: "logs"

  # UNSW-NB15 ground-truth reference files (used ONLY for labeling)
  unsw_ground_truth_csv: "data/raw/UNSW-NB15/UNSW_NB15_GT.csv"
  unsw_training_parquet: "data/raw/usnw-nb 15/UNSW_NB15_training-set.parquet"
  unsw_testing_parquet: "data/raw/usnw-nb 15/UNSW_NB15_testing-set.parquet"

# --------------------------------------------------------------------------
# PCAP extraction
# --------------------------------------------------------------------------
extraction:
  # Backend: "scapy" (Python-native, pip-installable) or "tshark" (faster, needs install)
  backend: "scapy"

  # tshark path (auto-detected if on PATH, else specify)
  tshark_path: "tshark"

  # Maximum packets to buffer in memory before flushing to flow builder
  packet_batch_size: 50000

  # Protocols to extract (others are counted but not flow-keyed)
  protocols:
    - "tcp"
    - "udp"
    - "icmp"

# --------------------------------------------------------------------------
# Flow construction
# --------------------------------------------------------------------------
flows:
  # Bidirectional flow timeout: if no packet arrives within this window,
  # the flow is considered complete and a new flow starts for the same 5-tuple.
  flow_timeout_seconds: 120

  # Idle timeout: close flow if no activity for this many seconds
  idle_timeout_seconds: 60

  # Minimum flow duration in seconds (flows shorter than this are retained
  # but flagged; they are NOT dropped because scans are legitimately short)
  min_flow_duration: 0.0

  # Maximum packets per flow before forced flush (memory safety)
  max_packets_per_flow: 1000000

# --------------------------------------------------------------------------
# Feature engineering
# --------------------------------------------------------------------------
features:
  # Feature groups to compute. Disable groups to reduce feature count.
  groups:
    basic: true
    directional: true
    rate: true
    packet_length: true
    inter_arrival_time: true
    tcp_flags: true
    protocol: true

  # Epsilon added to zero-duration denominators to avoid division by zero
  duration_epsilon: 1.0e-6

# --------------------------------------------------------------------------
# Labeling
# --------------------------------------------------------------------------
labeling:
  # Maximum time tolerance (seconds) when matching flows to GT events
  time_tolerance_seconds: 1.0

  # Whether to use IP/port matching in addition to temporal matching
  use_ip_port_matching: true

  # Label for flows that cannot be matched to any GT event
  unknown_label: "UNKNOWN"

# --------------------------------------------------------------------------
# Task configuration
# --------------------------------------------------------------------------
task:
  # "binary" or "multiclass"
  mode: "binary"

  # Binary class mapping
  binary:
    normal: 0
    attack: 1

  # Multiclass class mapping
  multiclass:
    Normal: 0
    Fuzzers: 1
    Analysis: 2
    Backdoors: 3
    DoS: 4
    Exploits: 5
    Generic: 6
    Reconnaissance: 7
    Shellcode: 8
    Worms: 9

# --------------------------------------------------------------------------
# Data cleaning
# --------------------------------------------------------------------------
cleaning:
  # Strategy for missing values: "drop", "median", "zero"
  missing_value_strategy: "median"

  # Remove rows with impossible values (negative packets, negative bytes)
  remove_impossible: true

  # Remove exact duplicate flow records
  remove_duplicates: true

  # Maximum valid port number
  max_valid_port: 65535

# --------------------------------------------------------------------------
# Feature selection
# --------------------------------------------------------------------------
feature_selection:
  # Remove features with zero or near-zero variance
  remove_constant: true
  variance_threshold: 0.0

  # Remove features that are perfect duplicates of another
  remove_duplicates: true

  # Correlation threshold for redundancy check (report only, don't auto-remove)
  correlation_report_threshold: 0.98

  # Features to always exclude from ML (metadata, identifiers)
  exclude_features:
    - "flow_id"
    - "src_ip"
    - "dst_ip"
    - "src_port"
    - "dst_port"
    - "start_time"
    - "end_time"

# --------------------------------------------------------------------------
# Categorical encoding
# --------------------------------------------------------------------------
encoding:
  # Strategy: "ordinal" (for TabPFN, which handles categoricals natively)
  # or "onehot" (for classical models)
  categorical_strategy: "ordinal"

# --------------------------------------------------------------------------
# Numeric scaling
# --------------------------------------------------------------------------
scaling:
  # Strategy: "standard", "robust", "minmax", "none"
  # TabPFN has internal normalisation, so "none" is often fine.
  numeric_strategy: "robust"

# --------------------------------------------------------------------------
# Train / Validation / Test split
# --------------------------------------------------------------------------
splitting:
  # Strategy: "temporal" (recommended for network data),
  #           "stratified_random", "group_aware"
  strategy: "temporal"

  # Split ratios
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15

  # Random seed for reproducibility
  random_seed: 42

  # Leakage check: verify no identical flows across splits
  check_leakage: true

# --------------------------------------------------------------------------
# Dataset balancing
# --------------------------------------------------------------------------
balancing:
  # Strategy: "none" (natural distribution), "class_weight",
  #           "undersample", "oversample"
  strategy: "none"

  # Only applied to training set, never to validation/test
  apply_to_train_only: true

# --------------------------------------------------------------------------
# TabPFN parameters
# --------------------------------------------------------------------------
tabpfn:
  # Model checkpoint (pinned to v2 ungated)
  checkpoint: "tabpfn-v2-classifier.ckpt"

  # Device: "auto", "cpu", "cuda", "mps"
  device: "auto"

  # Maximum training samples per TabPFN context
  max_context_samples: 10000

  # TabPFN ensemble size: "auto" or integer
  n_estimators: "auto"

  # Maximum training samples (subsample if dataset is larger)
  max_train_samples: null  # null = use all available

  # Prediction batch size (prevents OOM on MPS/GPU)
  predict_batch_size: 1000

  # Use chunked ensemble for datasets > max_context_samples
  use_chunked_ensemble: true

  # Chunked ensemble aggregation: "weighted_vote" or "majority"
  ensemble_aggregation: "weighted_vote"

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging:
  level: "INFO"
  log_to_file: true
  log_format: "%(asctime)s | %(levelname)-7s | %(name)-28s | %(message)s"

# --------------------------------------------------------------------------
# Performance
# --------------------------------------------------------------------------
performance:
  # Number of parallel workers (0 = sequential)
  workers: 0

  # Progress bar
  show_progress: true

# --------------------------------------------------------------------------
# Reproducibility
# --------------------------------------------------------------------------
reproducibility:
  random_seed: 42
  record_checksums: true
  record_package_versions: true
