# ==========================================================================
# TabPFN-NIDS Pipeline Configuration
# ==========================================================================
# Central config for the UNSW-NB15 PCAP → TabPFN intrusion detection pipeline.
# Every module reads from this file via src/tabpfn_nids/pipeline_config.py.
#
# IMPORTANT:
# The labeling stage uses the official UNSW-NB15 per-flow CSV:
#     UNSW-NB15_1.csv
#
# This is different from:
#     UNSW_NB15_GT.csv
#
# UNSW-NB15_1.csv contains the official per-flow labels that can be matched
# against flows extracted from 1.pcap using:
#     IP + Port + Protocol + Timestamp
# ==========================================================================


# --------------------------------------------------------------------------
# Paths
# --------------------------------------------------------------------------
paths:
  raw_data_dir: "data/raw/UNSW-NB15"

  intermediate_dir: "data/intermediate"

  processed_dir: "data/processed"

  artifacts_dir: "data/artifacts"

  results_dir: "results"

  logs_dir: "logs"

  # ------------------------------------------------------------------------
  # IMPORTANT:
  # Use the official per-flow UNSW-NB15 CSV for labeling.
  #
  # DO NOT use:
  #   UNSW_NB15_GT.csv
  #
  # The labeling implementation expects the 49-column raw flow CSV.
  # ------------------------------------------------------------------------
  unsw_ground_truth_csv: "data/raw/UNSW-NB15/UNSW-NB15_1.csv"

  # ------------------------------------------------------------------------
  # Reference datasets
  #
  # These are retained for project compatibility.
  # The current labeling implementation does NOT perform approximate
  # reference matching.
  # ------------------------------------------------------------------------
  unsw_training_parquet: "data/raw/usnw-nb 15/UNSW_NB15_training-set.parquet"

  unsw_testing_parquet: "data/raw/usnw-nb 15/UNSW_NB15_testing-set.parquet"


# --------------------------------------------------------------------------
# PCAP extraction
# --------------------------------------------------------------------------
extraction:
  # Backend:
  #   scapy  = Python-native
  #   tshark = faster but requires Wireshark/tshark
  backend: "scapy"

  # tshark path
  tshark_path: "tshark"

  # Maximum packets buffered before flushing
  packet_batch_size: 50000

  # Protocols to extract
  protocols:
    - "tcp"
    - "udp"
    - "icmp"


# --------------------------------------------------------------------------
# Flow construction
# --------------------------------------------------------------------------
flows:
  # Bidirectional flow timeout
  flow_timeout_seconds: 120

  # Idle timeout
  idle_timeout_seconds: 60

  # Minimum flow duration
  min_flow_duration: 0.0

  # Maximum packets per flow
  max_packets_per_flow: 1000000


# --------------------------------------------------------------------------
# Feature engineering
# --------------------------------------------------------------------------
features:
  groups:
    basic: true
    directional: true
    rate: true
    packet_length: true
    inter_arrival_time: true
    tcp_flags: true
    protocol: true

  # Prevent division by zero
  duration_epsilon: 1.0e-6


# --------------------------------------------------------------------------
# Labeling
# --------------------------------------------------------------------------
labeling:

  # ------------------------------------------------------------------------
  # IMPORTANT:
  #
  # We validated the 1.pcap → UNSW-NB15_1.csv matching.
  #
  # A 5-second tolerance gave approximately:
  #
  #   56,918 / 58,294 matched
  #   97.64% coverage
  #
  # Unmatched flows remain UNKNOWN.
  # ------------------------------------------------------------------------
  time_tolerance_seconds: 5.0

  # Match using source/destination IP and ports
  use_ip_port_matching: true

  # Never silently convert unmatched flows to Normal
  unknown_label: "UNKNOWN"


# --------------------------------------------------------------------------
# Task configuration
# --------------------------------------------------------------------------
task:
  # "binary" or "multiclass"
  mode: "binary"

  # Binary class mapping
  binary:
    normal: 0
    attack: 1

  # Multiclass class mapping
  multiclass:
    Normal: 0
    Fuzzers: 1
    Analysis: 2
    Backdoors: 3
    DoS: 4
    Exploits: 5
    Generic: 6
    Reconnaissance: 7
    Shellcode: 8
    Worms: 9


# --------------------------------------------------------------------------
# Data cleaning
# --------------------------------------------------------------------------
cleaning:
  # Missing-value strategy
  missing_value_strategy: "median"

  # Remove impossible values
  remove_impossible: true

  # Remove exact duplicate flow records
  remove_duplicates: true

  # Maximum valid port number
  max_valid_port: 65535


# --------------------------------------------------------------------------
# Feature selection
# --------------------------------------------------------------------------
feature_selection:

  # Remove constant features
  remove_constant: true

  variance_threshold: 0.0

  # Remove duplicate features
  remove_duplicates: true

  # Correlation threshold
  correlation_report_threshold: 0.98

  # Metadata / identifier columns excluded from ML
  exclude_features:
    - "flow_id"
    - "src_ip"
    - "dst_ip"
    - "src_port"
    - "dst_port"
    - "start_time"
    - "end_time"


# --------------------------------------------------------------------------
# Categorical encoding
# --------------------------------------------------------------------------
encoding:

  # TabPFN-compatible categorical handling
  categorical_strategy: "ordinal"


# --------------------------------------------------------------------------
# Numeric scaling
# --------------------------------------------------------------------------
scaling:

  # TabPFN performs internal normalization
  numeric_strategy: "robust"


# --------------------------------------------------------------------------
# Train / Validation / Test split
# --------------------------------------------------------------------------
splitting:

  # Temporal split is appropriate for network traffic
  strategy: "temporal"

  train_ratio: 0.7

  validation_ratio: 0.15

  test_ratio: 0.15

  random_seed: 42

  # Check for leakage between splits
  check_leakage: true


# --------------------------------------------------------------------------
# Dataset balancing
# --------------------------------------------------------------------------
balancing:

  # Keep natural class distribution
  strategy: "none"

  # Only applies to training data
  apply_to_train_only: true


# --------------------------------------------------------------------------
# TabPFN parameters
# --------------------------------------------------------------------------
tabpfn:

  # Model checkpoint
  checkpoint: "tabpfn-v2-classifier.ckpt"

  # Automatically choose CPU/CUDA/MPS
  device: "auto"

  # Maximum training samples per context
  max_context_samples: 2000

  # Ensemble size
  n_estimators: 2

  # null = use all available training samples
  max_train_samples: null

  # Prediction batch size
  predict_batch_size: 500

  # Enable chunked ensemble for larger datasets
  use_chunked_ensemble: true

  # Ensemble aggregation
  ensemble_aggregation: "weighted_vote"


# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging:

  level: "INFO"

  log_to_file: true

  log_format: "%(asctime)s | %(levelname)-7s | %(name)-28s | %(message)s"


# --------------------------------------------------------------------------
# Performance
# --------------------------------------------------------------------------
performance:

  # 0 = sequential
  workers: 0

  # Show progress
  show_progress: true


# --------------------------------------------------------------------------
# Reproducibility
# --------------------------------------------------------------------------
reproducibility:

  random_seed: 42

  record_checksums: true

  record_package_versions: true


# --------------------------------------------------------------------------
# Dynamic Parallel & Ensemble Inference
# --------------------------------------------------------------------------
inference:

  # Maximum rows processed per worker chunk
  max_rows_per_worker: 10000

  # Maximum parallel workers (null = automatic based on CPU cores)
  max_workers: null

  # Concurrency mechanism: "thread" (recommended for PyTorch CPU), "process", "sequential"
  executor_type: "thread"

  # Probability aggregation method for ensemble: "mean" or "weighted"
  probability_aggregation: "mean"

  # Classification decision threshold (Attack if P(Attack) >= threshold)
  prediction_threshold: 0.5

  # Enable ensemble when multiple models are available
  enable_ensemble: true

  # Include individual model probabilities in output CSV
  include_per_model_probabilities: false

  # Optional per-model weights (null = equal weighting)
  weights: null